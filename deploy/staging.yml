services:
  ci-sandbox:
    image: ${CI_SANDBOX_IMAGE:-ghcr.io/nblfrommars/ci-sandbox:latest}
    pull_policy: always
    ports:
      - "${STAGING_PORT:-5173}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
