spring:
  application:
    name: ci-failure-analyzer

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/cfa
    username: cfa
    password: cfa_dev_password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: cfa
    password: cfa_dev_password

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

github:
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  app-id: ${GITHUB_APP_ID:}
  private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}

cfa:
  llm:
    profile: ${LLM_PROFILE:local}
    base-url: ${LLM_BASE_URL:http://localhost:11434}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:qwen3:4b}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:300}

  eval:
    enabled: ${CFA_EVAL_ENABLED:false}
    data-dir: ${CFA_EVAL_DATA_DIR:}
    db-enabled: ${CFA_EVAL_DB_ENABLED:false}
    report-dir: ${CFA_EVAL_REPORT_DIR:eval-reports}

  orchestrator:
    enabled: ${CFA_ORCHESTRATOR_ENABLED:false}
    demo-repo: ${CFA_ORCHESTRATOR_DEMO_REPO:nblfrommars/ci-sandbox}
    openclaw:
      executable: ${OPENCLAW_EXECUTABLE:openclaw.cmd}
      timeout-seconds: ${OPENCLAW_TIMEOUT_SECONDS:300}
  testgen:
    demo-repo: ${CFA_TESTGEN_DEMO_REPO:${CFA_ORCHESTRATOR_DEMO_REPO:nblfrommars/ci-sandbox}}
    internal-token: ${CFA_TESTGEN_INTERNAL_TOKEN:}
  telegram:
    enabled: ${CFA_TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    approval-timeout-minutes: ${TELEGRAM_APPROVAL_TIMEOUT_MINUTES:30}
